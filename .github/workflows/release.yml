name: Release Nexus (Multiplatform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── 1. CREAR EL OBJETO RELEASE EN GITHUB PRIMERO ───
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Creando o actualizando Release para el tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "Nexus $TAG_NAME" \
            --notes "Actualización de Nexus Gaming Chat para Windows (.exe) y Linux (.AppImage) con Chromium nativo optimizado." \
            || echo "La release ya existía, continuando..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 2. COMPILAR E INSTALAR WINDOWS (ELECTRON) ───
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer (.exe)
        run: npx electron-builder --windows nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          Write-Host "Subiendo instalador de Windows a release: $tag"
          gh release upload "$tag" release-electron/*.exe --clobber
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 3. COMPILAR E INSTALAR LINUX (APPIMAGE) ───
  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux AppImage
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Subiendo AppImage a release: $TAG_NAME"
          gh release upload "$TAG_NAME" release-electron/*.AppImage --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
