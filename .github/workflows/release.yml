name: Release Nexus (Multiplatform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── BUILD WINDOWS (ELECTRON CON CHROMIUM PURO, PERMISOS WEBRTC Y BAJO CONSUMO) ───
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer (.exe)
        run: npx electron-builder --windows nsis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        run: |
          $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          Write-Host "Subiendo instalador de Windows a release: $tag"
          gh release upload "$tag" release-electron/*.exe --clobber
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── BUILD LINUX (ELECTRON CON CHROMIUM PURO Y GEAR LEVER / APPIMAGE) ───
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux AppImage
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Subiendo AppImage a release: $TAG_NAME"
          gh release upload "$TAG_NAME" release-electron/*.AppImage --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
