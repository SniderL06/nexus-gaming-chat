name: Release Nexus (Auto-Updater)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─── BUILD WINDOWS CON TAURI (Ligero, rápido y funciona perfecto en Windows) ───
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Frontend Dist
        run: node scripts/prepare-dist.js

      - name: Build and Release with Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Nexus v__VERSION__'
          releaseBody: 'Actualización automática de Nexus Gaming Chat para Windows (Tauri) y Linux (Electron AppImage con Chromium nativo).'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  # ─── BUILD LINUX CON ELECTRON (Chromium puro, permisos micrófono/cámara y ads) ───
  release-linux:
    permissions:
      contents: write
    needs: release-windows
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install

      - name: Build Electron AppImage (Linux)
        run: npx electron-builder --linux AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-electron/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
